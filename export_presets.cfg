; 데모 내보내기 설정 (2026-11-28). Godot 편집기: 프로젝트 → 내보내기 → 프리셋 고르기 → "프로젝트 내보내기"
; 먼저 편집기에서 "내보내기 템플릿 관리"로 4.7.2 템플릿을 한 번 내려받아야 한다.
; 명령줄: python3 scripts/export_demo.py

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="demo"
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, work/*, reports/*, perf/*, art/*, docs/*, scripts/*, src/core/*, src/game/main.gd, src/game/main.tscn"
export_path="build/windows/KILNBORN-demo.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/modify_resources=true
application/icon=""
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name=""
application/product_name="KILNBORN"
application/file_description="KILNBORN Demo"
application/copyright=""

[preset.1]

name="Web"
platform="Web"
runnable=false
dedicated_server=false
custom_features="demo"
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, work/*, reports/*, perf/*, art/*, docs/*, scripts/*, src/core/*, src/game/main.gd, src/game/main.tscn"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
